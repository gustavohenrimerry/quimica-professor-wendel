<!DOCTYPE html>  
<html lang="pt-BR">
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugestões - Química com Professor Wendel</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
    <script src="js/supabaseClient.js"></script>
    <script src="js/utils.js"></script>
    <style>  
        .container-sugestoes {  
            max-width: 600px;  
            margin: 40px auto;  
            padding: 20px;  
            background: #1e2621;  
            border-radius: 12px;  
            color: white;  
            border: 1px solid #a3e4d7;  
            font-family: Arial, sans-serif;  
        }

        .container-sugestoes input,  
        .container-sugestoes textarea {  
            width: 100%;  
            padding: 10px;  
            margin-top: 5px;  
            margin-bottom: 15px;  
            border-radius: 6px;  
            border: 1px solid #555;  
            background: #2a352f;  
            color: white;  
            box-sizing: border-box;  
        }

        .lista-sugestoes {  
            margin-top: 30px;  
        }

        .item-sugestao {  
            background: #2a352f;  
            padding: 15px;  
            border-radius: 8px;  
            margin-bottom: 10px;  
            border-left: 4px solid #00b4d8;  
        }  
    </style>  
</head>
<body>

<div id="barra-admin">
    <span id="status-admin" style="color: #a3e4d7; font-weight: bold; margin-right: 15px;">🔒 Modo Visitante</span>
    <div id="bloco-login" style="display: inline-block;">
        <input type="email" id="email-prof" placeholder="E-mail do Professor" style="width: 180px;">
        <input type="password" id="senha-prof" placeholder="Senha" style="width: 140px;">
        <button onclick="entrarAdmin()" style="background: #00b4d8; color: white;">Entrar</button>
    </div>
    <div id="botoes-admin" style="display: none;">
        <button onclick="sairAdmin()" style="background: #dc3545; color: white; margin-left: 5px;">Sair</button>
    </div>
</div>

<header>
    <div class="logo">
        <a href="index.html" style="text-decoration: none; display: flex; align-items: center; gap: 10px; color: inherit;">  
        <img src="assets/imagens/logo/logo.png" alt="Logo Química com Professor Wendel">
        Química com Professor Wendel
    </div>

    <nav>
        <a href="index.html">Início</a>
        <a href="paginas/experimentos.html">Experimentos</a>
        <a href="paginas/videos.html">Vídeos</a>
        <a href="paginas/perguntas.html">Perguntas</a>
        <a href="paginas/professor.html">Professor</a>
        <a href="sugestoes.html">Sugestões</a>
    </nav>
</header>

<div class="container-sugestoes">
    <h2>💬 Envie sua Sugestão ou Dúvida</h2>  
    <p>O Professor Wendel quer saber o que você gostaria de ver no site!</p>

    <label>Seu Nome (Opcional):</label>  
    <input type="text" id="nome-aluno" placeholder="Ex: João Silva">

    <label>Sua Sugestão:</label>  
    <textarea id="texto-sugestao" rows="4" placeholder="Escreva sua sugestão de conteúdo..."></textarea>

    <button  
        onclick="enviarSugestao()"  
        style="background:#28a745; color:white; padding:10px 20px; border:none; border-radius:6px; cursor:pointer; font-weight:bold;"  
    >  
        Enviar Sugestão  
    </button>

    <div id="painel-professor" style="display:none; margin-top:40px; border-top:1px solid #555; padding-top:20px;">  
        <h3 style="color: #a3e4d7;">🔐 Painel do Professor: Sugestões Recebidas</h3>  
        <div id="lista-sugestoes-admin" class="lista-sugestoes">Carregando...</div>  
    </div>
</div>

<footer>  
    <p>© 2026 - <a href="https://github.com/gustavohenrimerry" target="_blank" rel="noopener noreferrer">Desenvolvido por Gustavo</a></p>  
</footer>

<script>
    async function verificarAcessoProfessor() {  
        const eProf = await verificarSeProfessor();
        const painel = document.getElementById("painel-professor");  
        if (!painel) return;

        if (eProf) {  
            painel.style.display = "block";  
            if (typeof carregarSugestoesAdmin === "function") {  
                carregarSugestoesAdmin();  
            }  
        } else {  
            painel.style.display = "none";  
        }  
    }

    document.addEventListener("DOMContentLoaded", () => {  
        verificarAcessoProfessor();
    });

    async function enviarSugestao() {  
        const nome = document.getElementById("nome-aluno").value.trim() || "Anônimo";  
        const mensagem = document.getElementById("texto-sugestao").value.trim();

        if (!mensagem) {  
            alert("Escreva uma mensagem antes de enviar!");  
            return;  
        }

        try {  
            const resultado = await window.meuClienteSupabase  
                .from("sugestoes")  
                .insert([{ nome: nome, mensagem: mensagem }]);

            if (resultado.error) {  
                console.error(resultado.error);  
                alert("Erro ao enviar: " + resultado.error.message);  
                return;  
            }

            alert("Sugestão enviada com sucesso! Obrigado.");  
            document.getElementById("texto-sugestao").value = "";  
            document.getElementById("nome-aluno").value = "";
            verificarAcessoProfessor();

        } catch (erro) {  
            console.error(erro);  
            alert("Ocorreu um erro ao enviar a sugestão.");  
        }  
    }

    async function carregarSugestoesAdmin() {  
        const container = document.getElementById("lista-sugestoes-admin");

        try {  
            const resultado = await window.meuClienteSupabase  
                .from("sugestoes")  
                .select("*")  
                .order("criado_em", { ascending: false });

            const data = resultado.data;  
            const error = resultado.error;

            if (error) {  
                console.error(error);  
                container.innerHTML = "Erro ao carregar sugestões: " + error.message;  
                return;  
            }

            if (!data || data.length === 0) {  
                container.innerHTML = "<p>Nenhuma sugestão recebida ainda.</p>";  
                return;  
            }

            container.innerHTML = data.map(function (s) {  
                return `  
                    <div class="item-sugestao">  
                        <strong>De: ${s.nome || "Anônimo"}</strong>  
                        <p style="margin: 5px 0 10px 0;">${s.mensagem}</p>  
                        <small style="color: #aaa;">  
                            Enviado em: ${s.criado_em ? new Date(s.criado_em).toLocaleDateString() : "Data não disponível"}  
                        </small>  
                        <br>  
                        <button  
                            onclick="excluirSugestao('${s.id}')"  
                            style="background:#dc3545; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; margin-top:8px;"  
                        >  
                            Excluir  
                        </button>  
                    </div>  
                `;  
            }).join("");

        } catch (erro) {  
            console.error(erro);  
            container.innerHTML = "Erro inesperado ao carregar sugestões.";  
        }  
    }

    async function excluirSugestao(id) {  
        if (!confirm("Deseja apagar esta sugestão?")) return;

        try {  
            const resultado = await window.meuClienteSupabase  
                .from("sugestoes")  
                .delete()  
                .eq("id", id);

            if (resultado.error) {  
                console.error(resultado.error);  
                alert("Erro ao excluir: " + resultado.error.message);  
                return;  
            }

            carregarSugestoesAdmin();

        } catch (erro) {  
            console.error(erro);  
            alert("Ocorreu um erro ao excluir.");  
        }  
    }
</script>

</body>
</html>
